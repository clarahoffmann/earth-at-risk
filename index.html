<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eaton Fire, 2025</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --panel: #fbfaf6;
      --text: #1d1c1a;
      --muted: #6f6a62;
      --rule: #dcd6ca;
      --accent: #e0861c;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font: 16px/1.65 "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 420px);
      height: 100vh;
    }

    .figure {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      min-width: 0;
      min-height: 0;
    }

    .figure a { display: block; cursor: zoom-in; }

    .figure img {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 48px);
      height: auto;
    }

    aside {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--panel);
      border-left: 1px solid var(--rule);
    }

    [role="tablist"] {
      display: flex;
      border-bottom: 1px solid var(--rule);
    }

    [role="tab"] {
      flex: 1 1 auto;
      margin-bottom: -1px;
      padding: 18px 10px 16px;
      background: none;
      border: 0;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    [role="tab"]:hover { color: var(--text); }
    [role="tab"][aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
    [role="tab"]:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

    [role="tabpanel"] {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px 32px;
      white-space: pre-wrap;
    }

    [role="tabpanel"].empty { color: var(--muted); font-style: italic; }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; height: auto; }
      .figure { padding: 16px; }
      .figure img { max-height: none; }
      aside { border-left: 0; border-top: 1px solid var(--rule); }
      [role="tabpanel"] { overflow: visible; padding: 20px 16px 32px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="figure">
      <a href="image/submission.png" target="_blank" rel="noopener" title="Open full resolution">
        <img src="image/submission_web.jpg" width="3200" height="1977"
             alt="Eaton Fire 2025, Los Angeles County: SAR imagery of the analysis area with estimated time of building destruction, power-line wires near the ignition point, a chart of damages from utility-caused wildfires, and a world map of where power grids, vegetation and dryness co-occur.">
      </a>
    </div>

    <aside>
      <div role="tablist" aria-label="Text about the image">
        <button role="tab" id="tab-caption" data-key="caption" aria-controls="panel-caption" aria-selected="true">Image caption</button>
        <button role="tab" id="tab-note" data-key="note" aria-controls="panel-note" aria-selected="false" tabindex="-1">Technical note</button>
        <button role="tab" id="tab-story" data-key="story" aria-controls="panel-story" aria-selected="false" tabindex="-1">Story</button>
      </div>
      <div role="tabpanel" id="panel-caption" aria-labelledby="tab-caption" tabindex="0" data-src="src/captions/image_caption.txt"></div>
      <div role="tabpanel" id="panel-note" aria-labelledby="tab-note" tabindex="0" data-src="src/captions/technical_note.txt" hidden></div>
      <div role="tabpanel" id="panel-story" aria-labelledby="tab-story" tabindex="0" data-src="src/captions/story.txt" hidden></div>
    </aside>
  </main>

  <script>
    const tabs = [...document.querySelectorAll('[role="tab"]')];

    function select(tab) {
      for (const t of tabs) {
        const on = t === tab;
        t.setAttribute('aria-selected', on);
        t.tabIndex = on ? 0 : -1;
        document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
      }
      history.replaceState(null, '', '#' + tab.dataset.key);
    }

    for (const [i, tab] of tabs.entries()) {
      tab.addEventListener('click', () => select(tab));
      tab.addEventListener('keydown', (e) => {
        const step = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
        if (!step) return;
        const next = tabs[(i + step + tabs.length) % tabs.length];
        select(next);
        next.focus();
      });

      const panel = document.getElementById(tab.getAttribute('aria-controls'));
      fetch(panel.dataset.src)
        .then((r) => (r.ok ? r.text() : Promise.reject(r.status)))
        .then((text) => {
          text = text.trim();
          panel.textContent = text || 'Nothing here yet.';
          panel.classList.toggle('empty', !text);
        })
        .catch(() => {
          panel.textContent = 'Could not load ' + panel.dataset.src + '.';
          panel.classList.add('empty');
        });
    }

    const initial = tabs.find((t) => '#' + t.dataset.key === location.hash);
    if (initial) select(initial);
  </script>
</body>
</html>
